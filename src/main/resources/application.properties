spring.application.name=student-api
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/students}
spring.datasource.username=${DB_USER:students}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
student.full-name=${STUDENT_FULL_NAME:Tajibayev Assylbek}
