name: ${PROJECT_NAME:-tajibayev-assylbek-student-api}
services:
  app:
    build: .
    image: ${PROJECT_NAME:-tajibayev-assylbek-student-api}:${IMAGE_TAG:-v1.1-tajibayev-assylbek-38288}
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-students}
      DB_USER: ${DB_USER:-students}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      STUDENT_FULL_NAME: ${STUDENT_FULL_NAME:-Tajibayev Assylbek}
    depends_on:
      db:
        condition: service_healthy
    networks: [student-network]
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-students}
      POSTGRES_USER: ${DB_USER:-students}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [student-network]
volumes:
  postgres-data:
networks:
  student-network:
